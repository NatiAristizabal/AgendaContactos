<section>
  <div class="card">
    <h1>Agenda de contactos</h1>
    <h3>Iniciar sesión</h3>
    <form (submit)="login($event)">
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" [formField]="formLogin.email">

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" [formField]="formLogin.password">
      </div>
      <button type="submit" [disabled]="formLogin().invalid()">Iniciar sesión</button>
      <p>¿No tenés cuenta? <a routerLink="/register">Registrate</a></p>
    </form>
  </div>
</section>
