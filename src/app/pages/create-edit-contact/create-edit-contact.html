<header>
  <h1>Mis contactos</h1>
  <button (click)="authService.logout()">Cerrar sesión</button>
</header>
<main>
  <div class="card">
    <form (submit)="onSubmit($event)">
      <div>
        <label>
          Nombre
          <input type="text" [formField]="formCreateContact.firstName" />
        </label>
      </div>
      <div>
        <label>
          Apellido
          <input type="text" [formField]="formCreateContact.lastName" />
        </label>
      </div>
      <div>
        <label>
          Número de teléfono
          <input type="text" [formField]="formCreateContact.number!" />
        </label>
      </div>
      <button type="submit">{{ id() ? 'Editar contacto' : 'Agregar contacto' }}</button>
    </form>
  </div>
</main>
