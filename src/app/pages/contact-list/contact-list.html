<header>
  <h1>Mis contactos</h1>
  <button>Cerrar sesión</button>
</header>
<main>
  @for (contacto of contactsService.contactList; track $index) {
  <div class="contacto card">
    <a [routerLink]="['/contacts',contacto.id]">
      <span>
        <img [src]="'img/contact' + contacto.id + '.jpeg'" alt="Foto de {{contacto.nombre}}">
      </span>
      <span>
        {{contacto.nombre}} {{contacto.apellido}}
      </span>
      <span>
        {{contacto.numeroTelefono}}
      </span>
    </a>
    <div>
      <button [routerLink]="['/contacts', contacto.id, 'edit']">Editar</button>
      <button (click)="eliminarContacto(contacto.id)">Eliminar</button>
    </div>
  </div>
  }
  <a class="fab" routerLink="/contacts/create">+</a>
</main>
